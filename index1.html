let currentIdx = -1;
let currentPickPos = -1;

// 模糊匹配
function fuzzyMatch(userStr, ansStr){
    let s1 = userStr.replace(/ /g,'');
    let s2 = ansStr.replace(/ /g,'');
    const suffixList = ['市','地区','自治州','示范区','林区','盟','保护区','开发区'];
    for(let suf of suffixList){
        s1 = s1.replace(suf,'');
        s2 = s2.replace(suf,'');
    }
    return s2.includes(s1) || s1.includes(s2);
}

function initGame(){
    remainIdxList = [...Array(A.length).keys()];
    totalAttempts = 0;
    correctAttempts = 0;
    nextQuestion();
}

function nextQuestion(){
    document.getElementById('resultBox').textContent='';
    document.getElementById('answerInput').value='';
    if(remainIdxList.length === 0){
        alert('🎉 全部题目完成！');
        showStats();
        return;
    }
    currentPickPos = Math.floor(Math.random()*remainIdxList.length);
    currentIdx = remainIdxList[currentPickPos];
    const code = A[currentIdx];
    const ans = B[currentIdx];
    const finished = A.length - remainIdxList.length;
    document.getElementById('progress').innerText = `【进度：已完成${finished}/${A.length}】`;
    document.getElementById('qtext').innerText = `请输入 ${code} 对应的地区名称`;
    document.getElementById('answerInput').focus();
}

function submitAnswer(){
    const userInput = document.getElementById('answerInput').value.trim();
    totalAttempts++;
    const ans = B[currentIdx];
    if(fuzzyMatch(userInput, ans)){
        correctAttempts++;
        document.getElementById('resultBox').className='result correct';
        document.getElementById('resultBox').innerText = `✓ 正确！答案：${ans}`;
        remainIdxList.splice(currentPickPos,1);
    }else{
        document.getElementById('resultBox').className='result error';
        document.getElementById('resultBox').innerText = `✗ 错误，继续尝试`;
    }
    showStats();
    setTimeout(nextQuestion,1200);
}

function showAnswer(){
    const ans = B[currentIdx];
    alert(`正确答案：${ans}`);
}

function endGame(){
    showStats();
    if(confirm('确定退出练习？')){
        document.getElementById('qtext').innerText="练习已结束";
    }
}

function showStats(){
    let rate = totalAttempts===0 ? 0 : (correctAttempts/totalAttempts*100).toFixed(2);
    document.getElementById('statBox').innerHTML = `总尝试：${totalAttempts}｜正确：${correctAttempts}<br>正确率：${rate}%`;
}

window.onload = initGame;
